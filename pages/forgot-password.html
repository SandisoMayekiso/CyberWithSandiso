<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your CWS Academy account password."
    >

    <title>Reset Password | CWS Academy</title>


    <!-- =====================================================
         SITE STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="auth-brand">

                <a
                    href="../index.html"
                    class="academy-logo"
                >

                    <span class="logo-cws">
                        CWS
                    </span>

                    <span class="logo-text">
                        Academy
                    </span>

                </a>

            </div>


            <!-- =================================================
                 RESET PASSWORD CARD
            ================================================== -->

            <section class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        ACCOUNT RECOVERY
                    </span>

                    <h1>
                        Reset Password
                    </h1>

                    <p>
                        Enter your email address and we'll
                        send instructions to reset your password.
                    </p>

                </div>


                <!-- =================================================
                     RESET MESSAGE

                     reset-password.js uses #resetMessage
                ================================================== -->

                <div
                    id="resetMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>


                <!-- =================================================
                     RESET FORM
                ================================================== -->

                <form
                    id="resetForm"
                    class="auth-form"
                >

                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="resetEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="resetEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="resetBtn"
                        class="auth-submit"
                    >
                        Send Reset Link
                    </button>

                </form>


                <!-- =================================================
                     LOGIN
                ================================================== -->

                <div class="auth-switch">

                    <p>
                        Remember your password?

                        <a href="login.html">
                            Return to Login
                        </a>
                    </p>

                </div>


            </section>


            <!-- =================================================
                 RETURN HOME
            ================================================== -->

            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to CWS Academy
            </a>


        </div>

    </main>


    <!-- =====================================================
         FIREBASE PASSWORD RESET
    ====================================================== -->

    <script
        type="module"
        src="../js/reset-password.js"
    ></script>

</body>

</html>
