<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | CWS Academy</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-brand">

                <a
                    href="../index.html"
                    class="academy-logo"
                >

                    <span class="logo-cws">
                        CWS
                    </span>

                    <span class="logo-text">
                        Academy
                    </span>

                </a>

            </div>


            <section class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        ACCOUNT RECOVERY
                    </span>

                    <h1>
                        Reset Password
                    </h1>

                    <p>
                        Enter your email address and we'll
                        send instructions to reset your password.
                    </p>

                </div>


                <div
                    id="authMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <form
                    id="resetForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="resetEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="resetEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="resetBtn"
                        class="auth-submit"
                    >
                        Send Reset Link
                    </button>

                </form>


                <div class="auth-switch">

                    <p>
                        Remember your password?
                        <a href="login.html">
                            Return to Login
                        </a>
                    </p>

                </div>

            </section>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to CWS Academy
            </a>

        </div>

    </main>


    <script
        type="module"
        src="../js/auth.js"
    ></script>

</body>

</html>
