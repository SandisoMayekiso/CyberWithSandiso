<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sign in to your CWS Academy student account.">

    <title>Login | CWS Academy</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/cws-assistant.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">

                <a href="../index.html" class="academy-logo">
                    <span class="logo-cws">CWS</span>
                    <span class="logo-text">Academy</span>
                </a>

            </div>


            <section class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">STUDENT ACCESS</span>

                    <h1>Welcome Back</h1>

                    <p>
                        Sign in to continue your cybersecurity learning journey.
                    </p>

                </div>


                <div
                    id="loginMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>


                <form id="loginForm" class="auth-form">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe"
                            >

                            <span>Remember me</span>

                        </label>


                        <a href="forgot-password.html" class="forgot-link">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        id="loginBtn"
                        class="auth-submit"
                    >
                        Sign In
                    </button>

                </form>


                <div class="auth-switch">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create one
                        </a>
                    </p>

                </div>


                <div class="social-login">

                    <div class="auth-divider">
                        <span>OR CONTINUE WITH</span>
                    </div>


                    <div class="social-login-buttons">

                        <button
                            type="button"
                            id="googleLoginBtn"
                            class="social-login-btn google-btn"
                        >
                            <span class="social-icon">G</span>
                            <span>Continue with Google</span>
                        </button>


                        <button
                            type="button"
                            id="githubLoginBtn"
                            class="social-login-btn github-btn"
                        >
                            <span class="social-icon">
                                <i class="fab fa-github"></i>
                            </span>

                            <span>Continue with GitHub</span>
                        </button>

                    </div>

                </div>

            </section>


            <a href="../index.html" class="back-home">
                ← Back to CWS Academy
            </a>

        </div>

    </main>


    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/social-auth.js"></script>

    <script
        type="module"
        src="../js/cws-assistant.js"
    ></script>

</body>

</html>
